<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<title>Jimbo Dev</title>

</head>
<body>

<section class="hero" id="hero">
  <canvas class="fx" id="goo" aria-hidden="true"></canvas>
  <canvas class="fx" id="dots" aria-hidden="true"></canvas>
  <div>
    <svg viewBox="0 0 700 260" role="img" aria-label="hello">
      <text class="hello" x="350" y="200" text-anchor="middle">hello</text>
    </svg>
    <p class="sub">Görgess lefelé, és megmutatom, ki vagyok.</p>
  </div>
</section>
 
<section class="stage" id="stage">
  <div class="pin">
    <div class="editor" id="editor">
      <div class="tab">me.js</div>
      <pre id="code" aria-label="Forráskód"></pre>
    </div>
    <article class="card" id="card">
      <h2>Jimbo</h2>
      <p class="role">Webfejlesztő</p>
      <ul class="chips"><li>HTML</li><li>CSS</li><li>JavaScript</li></ul>
      <div class="status"><i></i>Nyitott új projektekre</div>
    </article>
  </div>
</section>
 
<section class="end"><p class="reveal">Projektek</p></section>
<a class="np" id="np" hidden target="_blank" rel="noopener">
  <img alt="" width="40" height="40">
  <span class="np-text"><b></b><small></small></span>
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
</a>
 
<script src="script.js"></script>
</body>
</html>
